<!doctype html>

<html>

<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="container">
    <h1 class="header">Video Speed by ctrl + scrolling</h1>
    <div class="controls-container">
      <div class="input-container">
        <label for="rate">Playback speed step</label>
        <input id="rate" class="input" type="text" />
      </div>
      <div class="checkbox-container">
        <input id="mode" type="checkbox" />
        <label for="mode">Laptop mode</label>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
